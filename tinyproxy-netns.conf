# tinyproxy forward proxy living INSIDE the vpn network namespace.
# Started by vpn-proxy.service via `ip netns exec vpn tinyproxy -d -c ...`.
# Egress follows the namespace default route -> tun0 when the tunnel is up.
# Reachable only via the veth IP (SSH -L target); never exposed to the internet.

User nobody
Group nogroup
Port 8888
Listen 10.200.1.2
Timeout 30
LogFile "/var/log/tinyproxy/tinyproxy.log"
PidFile "/run/tinyproxy/tinyproxy.pid"
MaxClients 50
MinSpareServers 2
MaxSpareServers 5
StartServers 2
DisableViaHeader Yes

# Only the namespace itself and the host side of the veth pair.
Allow 127.0.0.1
Allow 10.200.1.0/24
